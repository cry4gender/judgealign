[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cry4gender-judgealign"
version = "0.1.0"
description = "计算两类裁判在同一批样本上的一致率与分歧样本的特征"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cry4gender" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cry4gender.github.io"
Repository = "https://github.com/cry4gender/judgealign"
Issues = "https://github.com/cry4gender/judgealign/issues"

[project.scripts]
judgealign = "judgealign:main"

[tool.setuptools]
py-modules = ["judgealign"]
